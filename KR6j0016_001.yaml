body:
  text: 三金剛真言誦三遍吽引吽引吽引三昧耶真言誦三遍曩莫三滿多沒馱南引阿參迷怛里參迷三摩曳娑縛二合賀法界生真言誦三遍曩莫三滿多沒馱南引達磨馱暏娑縛婆縛句唅引轉大法輪真言誦三遍曩莫三滿多縛日羅二合赦嚩日囉二合怛募句唅引金剛護身真言誦三遍曩莫三滿多縛日羅二合赦縛日羅二合迦縛制吽毗盧舍那根本真言誦七遍曩莫三滿多沒馱南引阿上聲呼之娑嚩二合賀引不動尊真言誦七遍曩莫三滿多縛日羅二合赦戰拏摩訶嚕殺拏娑泮吒耶吽怛羅吒含𤚥普供養真言誦三遍曩莫三滿多沒馱南薩縛他缺蘊那蘖帝娑破囉𠰘𤚥引誐誐曩釰娑縛賀燒香真言誦三遍曩莫三滿多沒馱南引達磨馱都拏蘖帝娑縛賀獻閼伽真言誦三遍曩莫三滿多沒馱南誐誐曩三磨三磨娑縛二合賀引烏芻澀摩金剛真言誦五遍唵俱嚕馱喃吽惹慈覺録云大毗盧遮那略要速疾門五支念誦法一卷仁運睿
